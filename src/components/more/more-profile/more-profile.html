<!-- more-profile CCA — Profile & KYC slide panel -->
<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': open()}">

  <div class="app-sub-panel__header app-sub-panel__header--dark">
    <button class="app-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="app-sub-panel__title" data-bind="text: nls.more_profile_kyc"></h2>
    <!-- ko ifnot: editMode() -->
    <button class="app-back-btn" data-bind="click: startEdit" title="Edit contact details">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <!-- /ko -->
    <!-- ko if: editMode() -->
    <div style="width:36px;"></div>
    <!-- /ko -->
  </div>

  <div class="app-sub-body">
  <div class="app-panel-body" style="padding-bottom:20px;">
    <!-- Avatar hero -->
    <div style="display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--c-gold),#B8903C);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;border:3px solid var(--c-border);margin-bottom:12px;" data-bind="text: userInitial"></div>
      <div style="font-size:18px;font-weight:800;color:var(--c-t1);" data-bind="text: currentUser().name"></div>
      <div style="font-size:12px;color:var(--c-t3);margin-top:4px;" data-bind="text: 'Customer ID: ' + currentUser().customerId"></div>
      <div style="display:inline-flex;align-items:center;gap:5px;background:var(--c-success-bg);border-radius:20px;padding:5px 12px;margin-top:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-success)" stroke-width="2.5" stroke-linecap="round" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg>
        <span style="font-size:11px;font-weight:700;color:var(--c-success);" data-bind="text: nls.more_kyc_verified"></span>
      </div>
    </div>

    <!-- Personal Information (read-only / KYC-locked) -->
    <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);overflow:hidden;margin-bottom:16px;">
      <div style="padding:10px 16px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:6px;">
        <span style="font-size:10px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;flex:1;" data-bind="text: nls.more_personal_info"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-t3)" stroke-width="2" stroke-linecap="round" width="12" height="12"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="font-size:10px;color:var(--c-t3);" data-bind="text: nls.more_kyc_locked"></span>
      </div>
      <div class="more-detail-row"><span>Full Name</span><span>Mohammed Al-Qahtani</span></div>
      <div class="more-detail-row"><span>Date of Birth</span><span>12 Mar 1985</span></div>
      <div class="more-detail-row"><span>Nationality</span><span>Libyan</span></div>
      <div class="more-detail-row" style="border:none;"><span>National ID</span><span>••••••4829</span></div>
    </div>

    <!-- Contact Details -->
    <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);overflow:hidden;margin-bottom:16px;">
      <div style="padding:10px 16px;border-bottom:1px solid var(--c-border);font-size:10px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;" data-bind="text: nls.more_contact_details"></div>

      <!-- ko ifnot: editMode() -->
      <div class="more-detail-row"><span>Mobile</span><span data-bind="text: savedMobile"></span></div>
      <div class="more-detail-row"><span>Email</span><span data-bind="text: savedEmail"></span></div>
      <div class="more-detail-row" style="border:none;"><span>Address</span><span data-bind="text: savedAddress"></span></div>
      <!-- /ko -->

      <!-- ko if: editMode() -->
      <div style="padding:12px 16px;border-bottom:1px solid var(--c-border);">
        <div style="font-size:11px;font-weight:600;color:var(--c-t3);margin-bottom:6px;" data-bind="text: nls.more_mobile"></div>
        <input type="tel" style="width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--c-t1);font-family:inherit;" data-bind="value: editMobile, valueUpdate: 'input'" placeholder="+218 91 234 5678">
      </div>
      <div style="padding:12px 16px;border-bottom:1px solid var(--c-border);">
        <div style="font-size:11px;font-weight:600;color:var(--c-t3);margin-bottom:6px;" data-bind="text: nls.more_email_lbl"></div>
        <input type="email" style="width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--c-t1);font-family:inherit;" data-bind="value: editEmail, valueUpdate: 'input'" placeholder="email@example.com">
      </div>
      <div style="padding:12px 16px;">
        <div style="font-size:11px;font-weight:600;color:var(--c-t3);margin-bottom:6px;" data-bind="text: nls.more_address"></div>
        <input type="text" style="width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--c-t1);font-family:inherit;" data-bind="value: editAddress, valueUpdate: 'input'" placeholder="City, Country">
      </div>
      <!-- /ko -->
    </div>
  </div>

  <!-- Sticky footer -->
  <div class="app-panel-footer">
    <!-- ko ifnot: editMode() -->
    <button class="app-btn app-btn--outline app-btn--full" data-bind="click: startEdit, text: nls.more_edit_contact"></button>
    <!-- /ko -->
    <!-- ko if: editMode() -->
    <button class="app-btn app-btn--primary app-btn--full" data-bind="click: saveDetails, text: nls.more_save_changes"></button>
    <button class="app-btn app-btn--ghost app-btn--full" data-bind="click: cancelEdit, text: nls.btn_cancel"></button>
    <!-- /ko -->
  </div>
  </div><!-- /.app-sub-body -->

</div>
