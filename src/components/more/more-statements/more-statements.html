<!-- more-statements CCA — Account Statement Download slide panel -->
<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': open()}">
  <div class="app-sub-panel__header app-sub-panel__header--dark">
    <button class="app-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="app-sub-panel__title">Statements</h2>
    <div style="width:36px;"></div>
  </div>

  <div class="app-sub-body">
  <div class="app-panel-body" style="padding-top:4px;">

    <!-- Account selector — grouped -->
    <div class="more-stmt-section">
      <div class="more-theme-label">Select Account</div>
      <!-- ko foreach: accountGroups -->
      <div style="margin-bottom:10px;">
        <div style="font-size:10px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;" data-bind="text: group"></div>
        <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);overflow:hidden;">
          <!-- ko foreach: items -->
          <div class="more-stmt-acct"
               data-bind="css: {'more-stmt-acct--sel': $parents[1].selectedAccount() === id}, click: function(){ $parents[1].selectAccount($data); }, style: {borderBottom: $index() < $parent.items.length - 1 ? '1px solid var(--c-border)' : 'none'}">
            <div class="more-stmt-acct-icon" data-bind="style: { background: iconBg }">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" width="18" height="18" data-bind="attr: { stroke: icon }"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: label"></div>
              <div style="font-size:11px;color:var(--c-t3);margin-top:1px;" data-bind="text: number + ' · ' + balance"></div>
            </div>
            <!-- ko if: $parents[1].selectedAccount() === id -->
            <div style="width:20px;height:20px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <!-- /ko -->
            <!-- ko ifnot: $parents[1].selectedAccount() === id -->
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--c-border);flex-shrink:0;"></div>
            <!-- /ko -->
          </div>
          <!-- /ko -->
        </div>
      </div>
      <!-- /ko -->
    </div>

    <!-- Period selector -->
    <div class="more-stmt-section">
      <div class="more-theme-label">Statement Period</div>
      <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);overflow:hidden;">
        <!-- ko foreach: periods -->
        <div class="more-security-row"
             data-bind="style: { borderBottom: $index() < $parent.periods.length - 1 ? '1px solid var(--c-border)' : 'none' }, click: function(){ $parent.selectPeriod($data); }">
          <span style="font-size:14px;font-weight:600;color:var(--c-t1);" data-bind="text: label"></span>
          <!-- ko if: $parent.selectedPeriod() === id -->
          <div style="width:20px;height:20px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <!-- /ko -->
          <!-- ko ifnot: $parent.selectedPeriod() === id -->
          <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--c-border);"></div>
          <!-- /ko -->
        </div>
        <!-- /ko -->
      </div>
    </div>

    <!-- Format selector -->
    <div class="more-stmt-section" style="margin-bottom:8px;">
      <div class="more-theme-label">Format</div>
      <div class="more-stmt-fmt-row">
        <!-- ko foreach: formats -->
        <div class="more-stmt-fmt-btn"
             data-bind="css: {'more-stmt-fmt-btn--sel': $parent.selectedFormat() === $data}, click: function(){ $parent.selectFormat($data); }, text: $data"></div>
        <!-- /ko -->
      </div>
    </div>

  </div>

  <!-- Sticky download button -->
  <div class="app-panel-footer">
    <button class="app-btn app-btn--primary app-btn--full" data-bind="click: download, disable: isDownloading()">
      <!-- ko if: isDownloading() -->
      <span style="display:inline-flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Preparing…
      </span>
      <!-- /ko -->
      <!-- ko ifnot: isDownloading() -->
      <span style="display:inline-flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Statement
      </span>
      <!-- /ko -->
    </button>
  </div>
  </div><!-- /.app-sub-body -->

</div>
