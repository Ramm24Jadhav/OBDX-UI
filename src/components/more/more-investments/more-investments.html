<!-- more-investments CCA — Investment Portfolio slide panel -->
<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': open()}">
  <div class="app-sub-panel__header">
    <button class="app-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="app-sub-panel__title">Investments</h2>
    <div style="width:36px;"></div>
  </div>

  <div style="overflow-y:auto;flex:1;padding:0 20px 24px;">

    <!-- Portfolio Summary -->
    <div class="more-inv-summary">
      <div class="more-inv-label">Total Portfolio Value</div>
      <div class="more-inv-total" data-bind="text: totalValue"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <span class="more-inv-gain more-inv-gain--pos" data-bind="text: todayGain + ' (' + todayGainPct + ') today'"></span>
      </div>
      <div class="more-inv-stats">
        <div class="more-inv-stat">
          <div style="font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;">1Y Return</div>
          <div style="font-size:16px;font-weight:800;color:#4ADE80;" data-bind="text: totalReturn"></div>
        </div>
        <div class="more-inv-stat">
          <div style="font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;">Active Funds</div>
          <div style="font-size:16px;font-weight:800;color:#fff;" data-bind="text: funds().length"></div>
        </div>
      </div>
    </div>

    <!-- Asset Allocation -->
    <div style="margin-bottom:16px;">
      <div class="more-theme-label">Asset Allocation</div>
      <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);padding:16px;">
        <!-- ko foreach: allocation -->
        <div class="more-inv-alloc-row">
          <div style="width:10px;height:10px;border-radius:50%;flex-shrink:0;" data-bind="style: { background: color }"></div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;color:var(--c-t1);" data-bind="text: label"></div>
            <div class="more-inv-alloc-bar-wrap" style="margin-top:4px;">
              <div class="more-inv-alloc-bar" data-bind="style: { background: color, width: pct + '%' }"></div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: pct + '%'"></div>
            <div style="font-size:11px;color:var(--c-t3);" data-bind="text: value"></div>
          </div>
        </div>
        <!-- /ko -->
      </div>
    </div>

    <!-- Fund List -->
    <div class="more-theme-label">My Funds</div>
    <!-- ko foreach: funds -->
    <div class="more-fund-card">
      <div class="more-fund-row">
        <div>
          <div class="more-fund-name" data-bind="text: name"></div>
          <div class="more-fund-type" data-bind="text: type"></div>
        </div>
        <div>
          <div class="more-fund-nav" data-bind="text: nav"></div>
          <div class="more-fund-return" data-bind="text: returnVal, css: {'more-fund-return--pos': returnPos}"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--c-border);">
        <div style="font-size:11px;color:var(--c-t3);" data-bind="text: units"></div>
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: value"></div>
      </div>
    </div>
    <!-- /ko -->

    <!-- CTAs -->
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="app-btn app-btn--primary" style="flex:2;" data-bind="click: investMore">Invest More</button>
      <button class="app-btn app-btn--ghost" style="flex:1;" data-bind="click: withdraw">Withdraw</button>
    </div>

  </div>
</div>
