<!-- more-primary-account CCA — Select primary account -->
<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': open()}">

  <div class="app-sub-panel__header">
    <button class="app-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="app-sub-panel__title">Primary Account</h2>
    <div style="width:36px;"></div>
  </div>

  <div class="app-panel-body" style="padding-top:20px;">
    <p style="font-size:13px;color:var(--c-t3);margin-bottom:16px;">Your primary account is used for direct debits, salary credits, and default transfers.</p>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <!-- ko foreach: accounts -->
      <div data-bind="click: $parent.select.bind($parent, $data)" style="background:var(--c-surface);border-radius:16px;padding:16px;cursor:pointer;transition:all .2s;position:relative;"
           data-bind="css: {'more-primary-acct--sel': $parent.isSelected($data)}, click: $parent.select.bind($parent,$data)">

        <!-- Primary badge -->
        <!-- ko if: $parent.isPrimary($data) -->
        <div style="position:absolute;top:12px;right:14px;font-size:9px;font-weight:700;background:var(--c-primary);color:#fff;border-radius:20px;padding:3px 8px;letter-spacing:.3px;">PRIMARY</div>
        <!-- /ko -->

        <div style="display:flex;align-items:center;gap:14px;">
          <!-- Account icon -->
          <div style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;" data-bind="style:{background: icon + '18'}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" width="22" height="22" data-bind="attr:{stroke: icon}"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </div>
          <!-- Details -->
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:700;color:var(--c-t1);" data-bind="text: label"></div>
            <div style="font-size:12px;color:var(--c-t3);margin-top:2px;" data-bind="text: number + ' · ' + balance"></div>
          </div>
          <!-- Radio circle -->
          <!-- ko if: $parent.isSelected($data) -->
          <div style="width:22px;height:22px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <!-- /ko -->
          <!-- ko ifnot: $parent.isSelected($data) -->
          <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--c-border);flex-shrink:0;"></div>
          <!-- /ko -->
        </div>

        <!-- Selection highlight border -->
        <div data-bind="if: $parent.isSelected($data)">
          <div style="position:absolute;inset:0;border-radius:16px;border:2px solid var(--c-primary);pointer-events:none;"></div>
        </div>
      </div>
      <!-- /ko -->
    </div>
  </div>

  <div class="app-panel-footer">
    <button class="app-btn app-btn--primary app-btn--full"
            data-bind="click: save, disable: !hasChange(), text: hasChange() ? 'Set as Primary' : 'Already Primary'"></button>
    <button class="app-btn app-btn--ghost app-btn--full" data-bind="click: onClose">Cancel</button>
  </div>

</div>
