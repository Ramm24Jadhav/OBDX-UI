<!-- more-forex CCA — Forex Rates & Converter slide panel -->
<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': open()}">
  <div class="app-sub-panel__header">
    <button class="app-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="app-sub-panel__title" data-bind="text: nls.more_forex_title"></h2>
    <div style="font-size:10px;color:var(--c-t3);font-weight:600;padding-right:4px;" data-bind="text: nls.more_forex_live"></div>
  </div>

  <div style="overflow-y:auto;flex:1;padding:0 20px 24px;">

    <!-- Converter -->
    <div class="more-forex-converter">
      <!-- From -->
      <div class="more-forex-input-row">
        <div class="more-forex-ccy" data-bind="text: fromCcy"></div>
        <input class="more-forex-amount" type="number" data-bind="value: amount, valueUpdate: 'input'" placeholder="0.00" inputmode="decimal"/>
      </div>

      <!-- Swap -->
      <div class="more-forex-divider">
        <div class="more-forex-swap" data-bind="click: swapCurrencies">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" width="16" height="16"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </div>
      </div>

      <!-- To -->
      <div class="more-forex-input-row">
        <div class="more-forex-ccy" data-bind="text: toCcy"></div>
        <div class="more-forex-result" data-bind="text: convertedAmount"></div>
      </div>
    </div>

    <!-- Currency selector pills -->
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;">
      <!-- ko foreach: rateList -->
      <div style="flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--c-border);background:var(--c-surface);font-size:12px;font-weight:700;color:var(--c-t2);cursor:pointer;white-space:nowrap;"
           data-bind="css: {'more-theme-opt--sel': $parent.toCcy() === ccy}, click: function(){ $parent.selectToCcy(ccy); }, text: ccy"></div>
      <!-- /ko -->
    </div>

    <!-- Rate table -->
    <div class="more-theme-label">Exchange Rates · Base: LYD</div>
    <div style="background:var(--c-surface);border-radius:16px;border:1px solid var(--c-border);overflow:hidden;">
      <div style="display:flex;padding:10px 16px;border-bottom:1px solid var(--c-border);font-size:10px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;">
        <div style="flex:1;" data-bind="text: nls.more_forex_currency"></div>
        <div style="width:72px;text-align:right;" data-bind="text: nls.more_forex_buy"></div>
        <div style="width:72px;text-align:right;" data-bind="text: nls.more_forex_sell"></div>
      </div>
      <!-- ko foreach: rateList -->
      <div class="more-rate-row" data-bind="click: function(){ $parent.selectToCcy(ccy); }">
        <div class="more-rate-flag" data-bind="text: flag"></div>
        <div style="flex:1;margin-left:10px;">
          <div class="more-rate-ccy" data-bind="text: ccy"></div>
          <div class="more-rate-name" data-bind="text: name"></div>
        </div>
        <div style="width:60px;text-align:right;">
          <div class="more-rate-buy" data-bind="text: buy"></div>
          <div class="more-rate-sell" data-bind="text: 'S: ' + sell"></div>
        </div>
      </div>
      <!-- /ko -->
    </div>

    <p style="font-size:10px;color:var(--c-t4);text-align:center;margin-top:12px;">Rates are indicative and subject to change. Last updated: just now</p>

  </div>
</div>
