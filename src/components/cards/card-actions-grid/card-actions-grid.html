<div class="cag-wrap">
  <div class="cag-grid oj-flex">
    <button class="cag-btn oj-sm-4 oj-md-3" data-bind="click: openBlockSheet">
      <div class="cag-icon cag-icon--red">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      </div>
      <span data-bind="text: nls.cards_block"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3" data-bind="click: openLimitSheet">
      <div class="cag-icon cag-icon--blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <span data-bind="text: nls.cards_set_limits"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3" data-bind="click: openPINSheet">
      <div class="cag-icon cag-icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <span data-bind="text: nls.cards_change_pin"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3" data-bind="click: onCardTap.bind($data, activeCard(), 0)">
      <div class="cag-icon cag-icon--purple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      </div>
      <span data-bind="text: nls.cards_view_details"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3" data-bind="click: toggleFreeze">
      <div class="cag-icon cag-icon--amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 2v20M4.93 4.93l14.14 14.14M2 12h20M4.93 19.07l14.14-14.14"/></svg>
      </div>
      <span data-bind="text: activeCard() && activeCard().frozen ? nls.cards_unfreeze : nls.cards_freeze"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3">
      <div class="cag-icon cag-icon--teal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span data-bind="text: nls.cards_disputes"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3">
      <div class="cag-icon cag-icon--pink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <span data-bind="text: nls.cards_e_statement"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3">
      <div class="cag-icon cag-icon--indigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <span data-bind="text: nls.cards_info"></span>
    </button>
    <button class="cag-btn oj-sm-4 oj-md-3">
      <div class="cag-icon cag-icon--orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </div>
      <span data-bind="text: nls.cards_replace"></span>
    </button>
  </div>
</div>
