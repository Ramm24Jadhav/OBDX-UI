<div class="clb-wrap">
  <div class="clb-hdr">
    <span class="clb-title" data-bind="text: nls.cards_spending_limits"></span>
    <button class="clb-edit-btn" data-bind="click: openLimitSheet, text: nls.cards_set_limit"></button>
  </div>
  <div class="clb-row">
    <div class="clb-labels">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.cards_daily"></span>
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: formatAmount(dailyLimit())"></span>
    </div>
    <div class="clb-bar-bg">
      <div class="clb-bar-fill clb-bar-fill--daily" data-bind="style: {width: limitPercent() + '%'}"></div>
    </div>
  </div>
  <div class="clb-row">
    <div class="clb-labels">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.cards_monthly"></span>
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: formatAmount(monthlyLimit())"></span>
    </div>
    <div class="clb-bar-bg">
      <div class="clb-bar-fill clb-bar-fill--monthly" data-bind="style: {width: Math.min(limitPercent() * 0.6, 100) + '%'}"></div>
    </div>
  </div>
</div>
