<div class="cpop-ov" data-bind="visible: open(), css: {'cpop-ov--open': open()}" style="display:none;">
  <div class="cpop-bg" data-bind="click: onClose"></div>
  <div class="cpop-content" data-bind="with: activeCard()">
    <div style="perspective:1000px;">
      <div class="cpop-3d" data-bind="css: {'cpop-3d--flipped': $parent.cardFlipped()}">
        <div class="cpop-face" data-bind="html: $parent.renderCardInner($data)"></div>
        <div class="cpop-face cpop-face-back">
          <div data-bind="attr:{style:'position:absolute;inset:0;background:'+$data.gradient+';border-radius:18px;'}"></div>
          <div class="cpop-magstripe"></div>
          <div class="cpop-sig-strip">
            <div class="cpop-sig-pattern"></div>
            <span class="cpop-cvv-label">CVV ●●●</span>
          </div>
          <div class="cpop-back-info">
            <div style="font-size:8px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6;padding:0 20px;">This card is issued by OBDX Mobile. For assistance call +218 21 444 5555</div>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="cpop-flip-btn" data-bind="click: $parent.flipCard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
        <span data-bind="text: $parent.cardFlipped() ? 'View Front' : 'View Back'"></span>
      </button>
      <button class="cpop-done-btn" data-bind="click: $parent.onClose">✕</button>
    </div>
  </div>
</div>
