<!-- ko if: open() -->
<div class="cps-backdrop" data-bind="click: onClose"></div>
<!-- /ko -->
<div class="cps-sheet" data-bind="css: {'cps-sheet--open': open()}">
  <div class="cps-handle"></div>
  <div class="cps-title" data-bind="text: nls.cards_change_pin"></div>
  <div class="cps-body">
    <div class="cps-dots-row">
      <!-- ko foreach: pinDots() -->
      <div class="cps-dot" data-bind="css: {'cps-dot--filled': $data}"></div>
      <!-- /ko -->
    </div>
    <div class="cpin-keypad oj-flex">
      <!-- ko foreach: keys -->
      <button class="cpin-key oj-sm-4" data-bind="text: $data !== 'X' ? $data : '', click: function(){ $parent.pinKey($data); }">
        <!-- ko if: $data === 'X' -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        <!-- /ko -->
      </button>
      <!-- /ko -->
    </div>
    <div class="cps-actions">
      <button class="cps-btn cps-btn--ghost" data-bind="click: onClose, text: nls.btn_cancel"></button>
    </div>
  </div>
</div>
