<div class="app-screen">

  <!-- Loading skeleton -->
  <div data-bind="visible: isLoading()" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
    <div class="skel" style="height:160px;border-radius:20px;"></div>
    <div class="skel" style="height:180px;border-radius:20px;"></div>
    <div class="skel" style="height:80px;border-radius:14px;"></div>
    <div class="skel" style="height:80px;border-radius:14px;"></div>
  </div>

  <!-- Content -->
  <div data-bind="visible: !isLoading()" style="display:flex;flex-direction:column;">

    <!-- Hero: gradient header + balance + tabs -->
    <div data-bind="css: heroTabClass()">
      <div class="acc-hero-blob acc-hero-blob--1"></div>
      <div class="acc-hero-blob acc-hero-blob--2"></div>
      <div class="acc-hero-inner">
      <div class="acc-hero-header">
        <div>
          <h2 data-bind="text: nls.acc_title"></h2>
          <div style="font-size:12px;color:rgba(255,255,255,.55);font-weight:400;margin-top:2px;" data-bind="text: nls.acc_subtitle"></div>
        </div>
        <button class="acc-open-btn" data-bind="click: function(){ openOrigination(showCurrentSavings() ? 'account' : showDeposits() ? 'deposit' : 'loan'); }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <!-- ko if: showCurrentSavings() --><span data-bind="text: nls.acc_open_account"></span><!-- /ko -->
          <!-- ko if: showDeposits() --><span data-bind="text: nls.acc_open_deposit"></span><!-- /ko -->
          <!-- ko if: showLoans() --><span data-bind="text: nls.acc_apply_loan"></span><!-- /ko -->
        </button>
      </div>

      <!-- Hero card — switches with active tab -->
      <!-- ko if: showCurrentSavings() -->
      <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:14px 14px 14px 16px;margin:10px 0 12px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;">
            <span data-bind="text: nls.acc_total_balance"></span>
          </div>
          <div class="s-num" style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:10px;" data-bind="text: 'LYD ' + formatAmount(currentAccounts().reduce(function(s,a){return s+(a.availableBalance||0);},0))">LYD 133,649.25</div>
          <div style="display:flex;gap:12px;align-items:center;">
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_no_of_accounts"></div><div style="font-size:13px;font-weight:700;color:#fff;" data-bind="text: currentAccounts().length">2</div></div>
            <div style="width:1px;height:28px;background:rgba(255,255,255,.15);"></div>
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_today_change"></div><div class="s-num" style="font-size:13px;font-weight:700;color:#86EFAC;">&#8593; LYD 9,700 (7.82%)</div></div>
          </div>
        </div>
        <svg width="78" height="70" viewBox="0 0 80 72" fill="none" style="flex-shrink:0;">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5C842"/><stop offset="100%" stop-color="#C8860A"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFE07A"/><stop offset="100%" stop-color="#D4930F"/></linearGradient></defs>
          <rect x="4" y="62" width="56" height="6" rx="3" fill="url(#g1)"/><rect x="7" y="56" width="50" height="6" rx="2" fill="url(#g1)"/><rect x="11" y="50" width="42" height="6" rx="2" fill="url(#g2)"/>
          <rect x="11" y="24" width="5" height="26" rx="2" fill="url(#g2)"/><rect x="21" y="24" width="5" height="26" rx="2" fill="url(#g2)"/><rect x="31" y="24" width="5" height="26" rx="2" fill="url(#g2)"/><rect x="41" y="24" width="5" height="26" rx="2" fill="url(#g2)"/><rect x="51" y="24" width="5" height="26" rx="2" fill="url(#g2)"/>
          <rect x="7" y="18" width="50" height="6" rx="2" fill="url(#g1)"/><polygon points="33,2 5,18 61,18" fill="url(#g1)"/>
          <ellipse cx="68" cy="60" rx="9" ry="3.5" fill="url(#g1)"/><rect x="59" y="49" width="18" height="11" rx="2" fill="url(#g2)"/><ellipse cx="68" cy="49" rx="9" ry="3.5" fill="url(#g1)"/><ellipse cx="68" cy="45" rx="9" ry="3.5" fill="url(#g2)"/><rect x="59" y="34" width="18" height="11" rx="2" fill="url(#g2)"/><ellipse cx="68" cy="34" rx="9" ry="3.5" fill="url(#g1)"/>
        </svg>
      </div>
      <!-- /ko -->

      <!-- ko if: showDeposits() -->
      <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:14px 14px 14px 16px;margin:10px 0 12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;" data-bind="text: nls.acc_total_deposited"></div>
          <div class="s-num" style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:10px;">LYD 250,000</div>
          <div style="display:flex;gap:12px;align-items:center;">
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_active_deposits"></div><div style="font-size:13px;font-weight:700;color:#fff;">3</div></div>
            <div style="width:1px;height:28px;background:rgba(255,255,255,.15);"></div>
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_interest_ytd"></div><div class="s-num" style="font-size:13px;font-weight:700;color:#86EFAC;">LYD 8,125</div></div>
          </div>
        </div>
        <svg width="72" height="70" viewBox="0 0 72 70" fill="none" style="flex-shrink:0;">
          <defs><linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient></defs>
          <!-- piggy bank shape -->
          <ellipse cx="34" cy="40" rx="22" ry="18" fill="url(#b1)"/>
          <ellipse cx="34" cy="40" rx="16" ry="12" fill="url(#b2)" opacity=".3"/>
          <ellipse cx="53" cy="38" rx="7" ry="6" fill="url(#b1)"/>
          <rect x="26" y="56" width="6" height="10" rx="3" fill="url(#b1)"/>
          <rect x="36" y="56" width="6" height="10" rx="3" fill="url(#b1)"/>
          <ellipse cx="20" cy="32" rx="4" ry="4" fill="#fff" opacity=".3"/>
          <rect x="29" y="22" width="10" height="5" rx="2.5" fill="url(#b2)"/>
          <!-- coin drop -->
          <ellipse cx="34" cy="18" rx="8" ry="3" fill="url(#b2)"/>
          <rect x="26" y="10" width="16" height="8" rx="2" fill="url(#b2)"/>
          <ellipse cx="34" cy="10" rx="8" ry="3" fill="#93C5FD"/>
          <!-- sparkle -->
          <circle cx="58" cy="20" r="3" fill="#93C5FD" opacity=".7"/>
          <circle cx="64" cy="32" r="2" fill="#60A5FA" opacity=".5"/>
          <circle cx="10" cy="24" r="2" fill="#93C5FD" opacity=".5"/>
        </svg>
      </div>
      <!-- /ko -->

      <!-- ko if: showLoans() -->
      <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:14px 14px 14px 16px;margin:10px 0 12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;" data-bind="text: nls.acc_total_outstanding"></div>
          <div class="s-num" style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:10px;">LYD 185,000</div>
          <div style="display:flex;gap:12px;align-items:center;">
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_active_loans"></div><div style="font-size:13px;font-weight:700;color:#fff;">2</div></div>
            <div style="width:1px;height:28px;background:rgba(255,255,255,.15);"></div>
            <div><div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;" data-bind="text: nls.acc_next_emi"></div><div class="s-num" style="font-size:13px;font-weight:700;color:#FCA5A5;">LYD 3,240 · 25 Jul</div></div>
          </div>
        </div>
        <svg width="72" height="70" viewBox="0 0 72 70" fill="none" style="flex-shrink:0;">
          <defs><linearGradient id="r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F87171"/><stop offset="100%" stop-color="#B91C1C"/></linearGradient><linearGradient id="r2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCA5A5"/><stop offset="100%" stop-color="#DC2626"/></linearGradient></defs>
          <!-- document / contract -->
          <rect x="14" y="8" width="38" height="50" rx="5" fill="url(#r1)"/>
          <rect x="14" y="8" width="38" height="50" rx="5" fill="url(#r2)" opacity=".4"/>
          <rect x="20" y="20" width="26" height="3" rx="1.5" fill="#fff" opacity=".7"/>
          <rect x="20" y="27" width="20" height="3" rx="1.5" fill="#fff" opacity=".5"/>
          <rect x="20" y="34" width="24" height="3" rx="1.5" fill="#fff" opacity=".5"/>
          <rect x="20" y="41" width="16" height="3" rx="1.5" fill="#fff" opacity=".5"/>
          <!-- pen / signature -->
          <rect x="34" y="46" width="20" height="5" rx="2.5" fill="url(#r1)" transform="rotate(-35 34 46)"/>
          <circle cx="54" cy="58" r="4" fill="url(#r2)"/>
          <!-- % symbol -->
          <circle cx="55" cy="18" r="10" fill="url(#r1)"/>
          <text x="55" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">%</text>
        </svg>
      </div>
      <!-- /ko -->

      <div class="acc-tabs" data-bind="foreach: tabs">
        <div data-bind="css: $parent.tabClass($data), click: $parent.selectTab" class="acc-tab">
          <span data-bind="text: label"></span>
        </div>
      </div>
      </div><!-- /acc-hero-inner -->
    </div><!-- /acc-hero -->

    <!-- Scrollable body — rounded top corners overlap hero -->
    <div class="acc-body-sheet" style="border-radius:20px 20px 0 0;margin-top:-20px;background:var(--c-bg);position:relative;z-index:2;">

      <!-- Current & Savings tab -->
      <acct-list params="[[accountListParams]]" data-bind="visible: showCurrentSavings()"></acct-list>

      <!-- Deposits tab -->
      <acct-deposits params="[[{}]]" data-bind="visible: showDeposits()"></acct-deposits>

      <!-- Loans tab -->
      <acct-loans params="[[{}]]" data-bind="visible: showLoans()"></acct-loans>

    </div>
  </div>

  <!-- Account detail slide-in -->
  <acct-detail params="[[accountDetailParams]]"></acct-detail>

  <!-- All bottom sheets -->
  <acct-sheets params="[[sheetsParams]]"></acct-sheets>

  <!-- Origination flow -->
  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:200;transform:translate(0,0);">
    <acct-origination params="[[originationParams]]"></acct-origination>
  </div>

</div>
