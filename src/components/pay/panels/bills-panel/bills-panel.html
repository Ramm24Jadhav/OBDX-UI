<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': isOpen()}">
  <div class="app-sub-panel__header">
    <button class="app-back-btn" data-bind="click: onClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h2 class="app-sub-panel__title" data-bind="text: nls.pay_bills"></h2>
    <div style="width:36px;"></div>
  </div>
  <div style="overflow-y:auto;flex:1;padding:16px 20px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div style="background:var(--c-surface);border-radius:14px;border:1px solid var(--c-border);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;align-items:flex-start;">
        <div style="width:38px;height:38px;border-radius:11px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Electricity</div>
        <div style="font-size:10px;color:var(--c-t3);">GECOL</div>
      </div>
      <div style="background:var(--c-surface);border-radius:14px;border:1px solid var(--c-border);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;align-items:flex-start;">
        <div style="width:38px;height:38px;border-radius:11px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Mobile</div>
        <div style="font-size:10px;color:var(--c-t3);">Libyana / Madar</div>
      </div>
      <div style="background:var(--c-surface);border-radius:14px;border:1px solid var(--c-border);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;align-items:flex-start;">
        <div style="width:38px;height:38px;border-radius:11px;background:#DCFCE7;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Water</div>
        <div style="font-size:10px;color:var(--c-t3);">GEWA</div>
      </div>
      <div style="background:var(--c-surface);border-radius:14px;border:1px solid var(--c-border);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;align-items:flex-start;">
        <div style="width:38px;height:38px;border-radius:11px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Internet</div>
        <div style="font-size:10px;color:var(--c-t3);">LTT</div>
      </div>
    </div>
    <!-- Due bill alert -->
    <div style="background:var(--c-surface);border-radius:16px;border:1.5px solid var(--c-warning, #F59E0B);overflow:hidden;">
      <div style="padding:12px 16px;background:rgba(245,158,11,.08);border-bottom:1px solid rgba(245,158,11,.2);display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span style="font-size:12px;font-weight:700;color:#D97706;">Due in 3 days</span>
      </div>
      <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:14px;font-weight:700;color:var(--c-t1);">Electricity Bill</div>
          <div style="font-size:11px;color:var(--c-t3);">Account: 1234567890</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:16px;font-weight:800;color:var(--c-t1);">LYD 420</div>
          <button style="margin-top:4px;padding:6px 12px;border-radius:8px;border:none;background:var(--c-primary);color:#fff;font-size:11px;font-weight:700;cursor:pointer;">Pay Now</button>
        </div>
      </div>
    </div>
  </div>
</div>
