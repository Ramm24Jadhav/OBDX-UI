<div class="app-sub-panel" data-bind="css: {'app-sub-panel--open': isOpen()}">
  <div class="app-sub-panel__header">
    <button class="app-back-btn" data-bind="click: onClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h2 class="app-sub-panel__title" data-bind="text: nls.pay_qr"></h2>
    <div style="width:36px;"></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px;">
    <div style="width:220px;height:220px;border-radius:20px;border:2px solid var(--c-border);background:var(--c-surface);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 100 100" width="180" height="180" fill="none" stroke="var(--c-t2)" stroke-width="3">
        <rect x="10" y="10" width="30" height="30" rx="3"/><rect x="15" y="15" width="20" height="20" rx="2" fill="var(--c-primary)" stroke="none"/>
        <rect x="60" y="10" width="30" height="30" rx="3"/><rect x="65" y="15" width="20" height="20" rx="2" fill="var(--c-primary)" stroke="none"/>
        <rect x="10" y="60" width="30" height="30" rx="3"/><rect x="15" y="65" width="20" height="20" rx="2" fill="var(--c-primary)" stroke="none"/>
        <rect x="60" y="60" width="8" height="8" fill="var(--c-t2)" stroke="none"/><rect x="72" y="60" width="8" height="8" fill="var(--c-t2)" stroke="none"/>
        <rect x="84" y="60" width="8" height="8" fill="var(--c-t2)" stroke="none"/><rect x="60" y="72" width="8" height="8" fill="var(--c-t2)" stroke="none"/>
        <rect x="84" y="72" width="8" height="8" fill="var(--c-t2)" stroke="none"/><rect x="60" y="84" width="8" height="8" fill="var(--c-t2)" stroke="none"/>
        <rect x="72" y="84" width="8" height="8" fill="var(--c-t2)" stroke="none"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <div style="font-size:16px;font-weight:800;color:var(--c-t1);">Mohammed Al-Qahtani</div>
      <div style="font-size:12px;color:var(--c-t3);margin-top:4px;">Scan to pay · LY44 2000 •••• 2341</div>
    </div>
    <div style="display:flex;gap:10px;width:100%;">
      <button class="app-btn app-btn--ghost" style="flex:1;" data-bind="text: nls.pay_share_qr"></button>
      <button class="app-btn app-btn--primary" style="flex:1;" data-bind="text: nls.pay_scan_pay"></button>
    </div>
  </div>
</div>
