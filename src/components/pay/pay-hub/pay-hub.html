<div data-bind="visible: showHub()" style="display:none;">
  <div style="padding:16px 20px 0;flex-shrink:0;">
    <h2 style="font-size:22px;font-weight:800;color:var(--c-t1);letter-spacing:-.4px;margin:0 0 16px;" data-bind="text: nls.pay_title"></h2>
  </div>

  <!-- Transfer section -->
  <div style="margin-bottom:4px;">
    <div style="padding:0 20px 8px;font-size:11px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;" data-bind="text: nls.pay_transfer"></div>
    <div class="pay-transfer-grid">
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('own'); }">
        <div class="pay-icon-circle" style="background:#FCE7EE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_own_account"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('within'); }">
        <div class="pay-icon-circle" style="background:#DBEAFE;"><svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_within_bank"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('domestic'); }">
        <div class="pay-icon-circle" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_domestic"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('international'); }">
        <div class="pay-icon-circle" style="background:#EDE9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_international"></span>
      </div>
    </div>
  </div>

  <!-- More Payments section -->
  <div style="margin-bottom:4px;">
    <div style="padding:0 20px 8px;font-size:11px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;" data-bind="text: nls.pay_more_payments"></div>
    <div class="pay-transfer-grid">
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('gcc'); }">
        <div class="pay-icon-circle" style="background:#FEF3C7;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_gcc_rtgs"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('afaq'); }">
        <div class="pay-icon-circle" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_afaq"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: openQR">
        <div class="pay-icon-circle" style="background:#EDE9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_qr"></span>
      </div>
      <div class="pay-icon-btn" data-bind="click: function(){ startPayFlow('adhoc'); }">
        <div class="pay-icon-circle" style="background:#FEF2F2;"><svg viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="10" y1="15" x2="14" y2="15"/></svg></div>
        <span class="pay-icon-label" data-bind="text: nls.pay_adhoc"></span>
      </div>
    </div>
  </div>

  <!-- Menu list -->
  <div class="pay-menu-list">
    <div class="pay-menu-row" data-bind="click: openBeneficiaries">
      <div class="pay-menu-icon" style="background:#FCE7EE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_beneficiaries"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="pay-menu-row" data-bind="click: openScheduled">
      <div class="pay-menu-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_scheduled"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="pay-menu-row" data-bind="click: openStanding">
      <div class="pay-menu-icon" style="background:#FEF3C7;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_standing"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="pay-menu-row" data-bind="click: openTracker">
      <div class="pay-menu-icon" style="background:#FCE7EE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_tracker"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="pay-menu-row" data-bind="click: openBills">
      <div class="pay-menu-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_bills"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="pay-menu-row" data-bind="click: openBulk">
      <div class="pay-menu-icon" style="background:#EDE9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" width="17" height="17"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
      <span class="pay-menu-text" data-bind="text: nls.pay_bulk"></span>
      <div class="pay-menu-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
  </div>

  <div style="height:80px;"></div>

  <qr-pay-panel params="isOpen: showQR, onClose: closeQR"></qr-pay-panel>
  <bene-panel params="isOpen: showBeneficiaries, onClose: closeBeneficiaries, beneficiaries: beneficiaries, onSelectBen: selectBeneficiary"></bene-panel>
  <scheduled-panel params="isOpen: showScheduled, onClose: closeScheduled"></scheduled-panel>
  <standing-panel params="isOpen: showStanding, onClose: closeStanding"></standing-panel>
  <bills-panel params="isOpen: showBills, onClose: closeBills"></bills-panel>
  <tracker-panel params="isOpen: showTracker, onClose: closeTracker"></tracker-panel>
  <bulk-panel params="isOpen: showBulk, onClose: closeBulk"></bulk-panel>
</div>
