<div data-bind="visible: showStep3()" style="display:none;flex:1;overflow-y:auto;">
  <!-- Amount hero -->
  <div style="margin:16px 20px 0;background:linear-gradient(135deg,#7A1531 0%,#C8A45D 100%);border-radius:20px;padding:24px 20px;color:#fff;">
    <div style="font-size:11px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;" data-bind="text: nls.pay_you_sending"></div>
    <div style="font-size:36px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px;">LYD <span data-bind="text: formatAmount(parseFloat(amount()) || 0)"></span></div>
    <div style="opacity:.8;font-size:13px;" data-bind="text: selectedBen() ? 'To ' + selectedBen().name : ''"></div>
  </div>

  <!-- Detail rows -->
  <div style="margin:12px 20px 0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;overflow:hidden;">
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.lbl_to"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: selectedBen() ? selectedBen().name : ''"></span>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_account_no"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: selectedBen() ? selectedBen().accountNo : ''"></span>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.lbl_from"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: selectedAccount() ? selectedAccount().typeLabel : ''"></span>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_purpose"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: purpose() || 'General Transfer'"></span>
    </div>
    <div style="padding:14px 16px;display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_schedule_date"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: scheduleEnabled() && scheduledDate() ? scheduledDate() : 'Today'"></span>
    </div>
  </div>

  <!-- Charges card -->
  <div style="margin:12px 20px 0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;overflow:hidden;">
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_transfer_amount"></span>
      <span style="font-size:13px;font-weight:700;color:var(--c-t1);">LYD <span data-bind="text: formatAmount(parseFloat(amount()) || 0)"></span></span>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_service_charges"></span>
      <span style="font-size:13px;font-weight:700;color:#16A34A;">LYD 0.00 <span style="font-size:11px;font-weight:600;">(Free)</span></span>
    </div>
    <div style="padding:14px 16px;display:flex;justify-content:space-between;background:rgba(122,21,49,.03);">
      <span style="font-size:13px;font-weight:800;color:var(--c-t1);" data-bind="text: nls.pay_total_debit"></span>
      <span style="font-size:14px;font-weight:900;color:var(--c-primary);">LYD <span data-bind="text: formatAmount(parseFloat(amount()) || 0)"></span></span>
    </div>
  </div>

  <!-- Disclaimer -->
  <div style="margin:12px 20px 0;background:#FFFBEB;border:1px solid #F59E0B;border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div style="font-size:12px;color:#92400E;line-height:1.5;">Once submitted, this transfer cannot be cancelled. Please verify all details before confirming.</div>
  </div>

  <div style="padding:20px;">
    <button class="app-btn app-btn--primary app-btn--full" data-bind="click: confirmTransfer, disable: isLoading">
      <span data-bind="visible: !isLoading(), text: nls.pay_btn_confirm"></span>
      <span data-bind="visible: isLoading(), text: nls.pay_sending"></span>
    </button>
  </div>
</div>
