<div data-bind="visible: showStep1()" style="display:none;">

  <!-- ── TRANSFER / BENEFICIARY FLOW ───────────────────────────────── -->
  <!-- ko ifnot: flowType() === 'own' -->

  <div class="pay-transfer-type" style="padding:16px 20px 0;">
    <p class="pay-field-label" data-bind="text: nls.pay_transfer_to"></p>
    <div data-bind="foreach: transferTypes">
      <div class="pay-type-card" data-bind="click: $parent.selectTransferType, css: {'pay-type-card--active': $parent.transferType() === id}">
        <div class="pay-type-card__icon" style="width:36px;height:36px;border-radius:10px;background:var(--c-surface);border:1px solid var(--c-border);"></div>
        <div class="pay-type-card__text">
          <span class="pay-type-card__label" data-bind="text: label"></span>
          <span class="pay-type-card__sub" data-bind="text: sub"></span>
        </div>
        <div class="pay-type-card__check" data-bind="visible: $parent.transferType() === id">✓</div>
      </div>
    </div>
  </div>

  <div style="padding:20px 20px 8px;">
    <div style="font-size:11px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;" data-bind="text: nls.pay_recent_ben"></div>
    <!-- ko if: beneficiaries().length === 0 -->
    <div style="text-align:center;padding:24px;color:var(--c-t3);font-size:13px;" data-bind="text: nls.pay_no_ben"></div>
    <!-- /ko -->
    <!-- ko foreach: beneficiaries -->
    <div class="pay-ben-row-item" data-bind="click: function(){ $parent.selectedBen($data); $parent.adhocMode(false); }, css: {'pay-ben-row-item--selected': $parent.selectedBen() === $data}">
      <div class="pay-ben-row-item__avatar" data-bind="text: initials, style:{background: avatarColor}"></div>
      <div class="pay-ben-row-item__info">
        <span class="pay-ben-row-item__name" data-bind="text: name"></span>
        <span class="pay-ben-row-item__bank" data-bind="text: accountNo || bank"></span>
      </div>
      <!-- ko if: $parent.selectedBen() === $data -->
      <div style="width:20px;height:20px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;">✓</div>
      <!-- /ko -->
      <!-- ko ifnot: $parent.selectedBen() === $data -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <!-- /ko -->
    </div>
    <!-- /ko -->
  </div>

  <!-- Adhoc / New Payee toggle -->
  <div style="padding:0 20px 8px;">
    <button class="pay-adhoc-toggle" data-bind="click: toggleAdhoc, css: {'pay-adhoc-toggle--active': adhocMode()}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Pay to New Account
    </button>
  </div>

  <!-- Adhoc form (has its own action button — Proceed — so no Continue in footer when adhocMode) -->
  <!-- ko if: adhocMode() -->
  <div class="pay-adhoc-form" style="margin:0 20px 20px;">
    <div class="pay-form-group">
      <label class="pay-form-label">Payee Name</label>
      <input class="pay-form-input" type="text" placeholder="Full name" data-bind="value: adhocName, valueUpdate: 'input'"/>
    </div>
    <div class="pay-form-group">
      <label class="pay-form-label">Account / IBAN Number</label>
      <input class="pay-form-input" type="text" placeholder="e.g. LY89 0000 0000 0001 2345 6789" data-bind="value: adhocAccountNo, valueUpdate: 'input'"/>
    </div>
    <div class="pay-form-group">
      <label class="pay-form-label">Bank (optional)</label>
      <input class="pay-form-input" type="text" placeholder="Bank name" data-bind="value: adhocBank, valueUpdate: 'input'"/>
    </div>
    <button class="app-btn app-btn--primary" style="width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:14px;margin-top:4px;"
      data-bind="click: proceedAdhoc">
      Proceed with New Payee →
    </button>
  </div>
  <!-- /ko -->

  <!-- /ko -->

</div>
