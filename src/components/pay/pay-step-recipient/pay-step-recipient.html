<div data-bind="visible: showStep1()" style="display:none;flex:1;overflow-y:auto;">
  <div class="pay-transfer-type" style="padding:16px 20px 0;">
    <p class="pay-field-label">Transfer To</p>
    <div data-bind="foreach: transferTypes">
      <div class="pay-type-card" data-bind="click: $parent.selectTransferType, css: {'pay-type-card--active': $parent.transferType() === id}">
        <div class="pay-type-card__icon" style="width:36px;height:36px;border-radius:10px;background:var(--c-surface);border:1px solid var(--c-border);"></div>
        <div class="pay-type-card__text">
          <span class="pay-type-card__label" data-bind="text: label"></span>
          <span class="pay-type-card__sub" data-bind="text: sub"></span>
        </div>
        <div class="pay-type-card__check" data-bind="visible: $parent.transferType() === id">✓</div>
      </div>
    </div>
  </div>

  <div style="padding:20px 20px 8px;">
    <div style="font-size:11px;font-weight:700;color:var(--c-t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;">Recent Beneficiaries</div>
    <!-- ko if: beneficiaries().length === 0 -->
    <div style="text-align:center;padding:24px;color:var(--c-t3);font-size:13px;">No beneficiaries yet</div>
    <!-- /ko -->
    <!-- ko foreach: beneficiaries -->
    <div class="pay-ben-row-item" style="padding:12px 0;" data-bind="click: function(){ $parent.selectBeneficiary($data); }">
      <div class="pay-ben-row-item__avatar" data-bind="text: initials, style:{background: avatarColor}"></div>
      <div class="pay-ben-row-item__info">
        <span class="pay-ben-row-item__name" data-bind="text: name"></span>
        <span class="pay-ben-row-item__bank" data-bind="text: accountNo || bank"></span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <!-- /ko -->
  </div>
  <div style="height:80px;"></div>
</div>
