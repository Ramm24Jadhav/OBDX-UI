<div class="pay-otp-screen" data-bind="visible: showStep4()" style="display:none;">
  <div style="width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#FCE7EE,#EDE9FE);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
  </div>
  <h2 class="pay-otp-title" data-bind="text: nls.pay_verify_title"></h2>
  <p class="pay-otp-sub" data-bind="text: nls.pay_otp_sent"></p>
  <p style="font-size:14px;font-weight:800;color:var(--c-t1);margin:4px 0 20px;text-align:center;">+218 •••• ••47</p>

  <div class="pay-otp-boxes" data-bind="foreach: [0,1,2,3,4,5]">
    <div class="pay-otp-box" data-bind="css: {'pay-otp-box--filled': $parent.otpDots() > $data}">
      <span data-bind="text: $parent.otpDots() > $data ? '•' : ''"></span>
    </div>
  </div>

  <div class="login-keypad" role="group" style="width:100%;margin-top:16px;">
    <div class="login-keypad__row">
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('1'); }"><span>1</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('2'); }"><span>2</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">ABC</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('3'); }"><span>3</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">DEF</span></button>
    </div>
    <div class="login-keypad__row">
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('4'); }"><span>4</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">GHI</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('5'); }"><span>5</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">JKL</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('6'); }"><span>6</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">MNO</span></button>
    </div>
    <div class="login-keypad__row">
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('7'); }"><span>7</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">PQRS</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('8'); }"><span>8</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">TUV</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('9'); }"><span>9</span><span style="font-size:8px;color:var(--c-t4);display:block;line-height:1;">WXYZ</span></button>
    </div>
    <div class="login-keypad__row">
      <button class="login-keypad__btn login-keypad__btn--empty"></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('0'); }"><span>0</span></button>
      <button class="login-keypad__btn" data-bind="click: function(){ otpKey('⌫'); }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
    </div>
  </div>

  <div style="padding:8px 20px;width:100%;box-sizing:border-box;">
    <button class="app-btn app-btn--primary app-btn--full" data-bind="click: _verifyOTP, enable: otpVal().length >= 6, text: nls.pay_btn_verify"></button>
  </div>
  <p class="pay-otp-resend"><span data-bind="text: nls.pay_resend_in"></span> <span data-bind="text: otpCountdownDisplay()"></span></p>
</div>
