<div class="pay-success-screen" data-bind="visible: showStep5()" style="display:none;">
  <div style="width:80px;height:80px;margin:0 auto 16px;">
    <svg viewBox="0 0 80 80" width="80" height="80">
      <circle cx="40" cy="40" r="36" fill="none" stroke="#DCFCE7" stroke-width="6"/>
      <circle cx="40" cy="40" r="36" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="226" stroke-dashoffset="0" stroke-linecap="round"/>
      <polyline points="25,40 36,52 55,28" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h2 class="pay-success-title" data-bind="text: nls.pay_success_title"></h2>
  <p style="font-size:13px;color:var(--c-t3);text-align:center;margin:4px 0 0;" data-bind="text: nls.pay_money_way"></p>

  <div style="margin:20px 20px 0;background:linear-gradient(135deg,#7A1531 0%,#C8A45D 100%);border-radius:18px;padding:20px;color:#fff;text-align:center;width:calc(100% - 40px);box-sizing:border-box;">
    <div style="font-size:10px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;" data-bind="text: nls.pay_amount_sent"></div>
    <div style="font-size:32px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px;">LYD <span data-bind="text: formatAmount(parseFloat(amount()) || 0)"></span></div>
    <div style="opacity:.8;font-size:12px;" data-bind="text: selectedBen() ? 'To ' + selectedBen().name : ''"></div>
  </div>

  <div style="margin:12px 20px 0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;overflow:hidden;width:calc(100% - 40px);box-sizing:border-box;">
    <div style="padding:13px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_success_ref"></span>
      <span style="font-size:12px;font-weight:700;color:var(--c-t1);" data-bind="text: referenceNo"></span>
    </div>
    <div style="padding:13px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.lbl_to"></span>
      <span style="font-size:12px;font-weight:700;color:var(--c-t1);" data-bind="text: selectedBen() ? selectedBen().name : ''"></span>
    </div>
    <div style="padding:13px 16px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.pay_success_date"></span>
      <span style="font-size:12px;font-weight:700;color:var(--c-t1);" data-bind="text: successDateTime() || '24 Jul 2026, 10:42 AM'"></span>
    </div>
    <div style="padding:13px 16px;display:flex;justify-content:space-between;">
      <span style="font-size:12px;color:var(--c-t3);" data-bind="text: nls.lbl_status"></span>
      <span style="font-size:12px;font-weight:700;color:#16A34A;display:inline-flex;align-items:center;gap:4px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg>
        <span data-bind="text: nls.pay_completed"></span>
      </span>
    </div>
  </div>

  <div style="height:16px;"></div>
</div>
