<div id="home-root" data-bind="css: {'rtl': currentLang() === 'ar'}">

  <!-- ── App-bar ──────────────────────────────────────────────── -->
  <div class="app-bar">
    <div class="app-bar__left">
      <div class="app-bar__avatar" data-bind="text: userName().charAt(0)"></div>
      <div>
        <div class="app-bar__greeting" data-bind="text: greeting()"></div>
        <div class="app-bar__name" data-bind="text: userName()"></div>
      </div>
    </div>
    <div class="app-bar__actions">
      <button class="app-bar__icon-btn" data-bind="click: toggleBalance" title="Toggle balance">
        <svg id="eye-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="app-bar__icon-btn" data-bind="click: toggleLang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <button class="app-bar__icon-btn notif-btn" data-bind="click: goToNotifs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <!-- ko if: unreadCount() > 0 -->
        <span class="notif-badge" data-bind="text: unreadCount()"></span>
        <!-- /ko -->
      </button>
    </div>
  </div>

  <!-- ── Main scroll content ───────────────────────────────────── -->
  <div class="home-content" data-bind="css: {'home-content--loading': isLoading()}">

    <!-- ko if: isLoading() -->
    <div class="home-skeleton">
      <div class="skeleton-card"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row skeleton-row--short"></div>
    </div>
    <!-- /ko -->

    <!-- ko ifnot: isLoading() -->

    <!-- Balance summary widget -->
    <oj-module config="[[balanceSummaryConfig]]"></oj-module>

    <!-- Spending overview widget -->
    <oj-module config="[[spendingOverviewConfig]]"></oj-module>

    <!-- Quick actions widget -->
    <oj-module config="[[quickActionsConfig]]"></oj-module>

    <!-- Recent transactions widget -->
    <oj-module config="[[recentTxConfig]]"></oj-module>

    <!-- /ko -->

    <div class="bottom-spacer"></div>
  </div>

  <!-- ── Notifications panel widget (overlay + slide-in) ──────── -->
  <oj-module config="[[notificationsPanelConfig]]"></oj-module>

  <!-- ── Analytics panel widget (full-screen slide-in) ────────── -->
  <oj-module config="[[analyticsPanelConfig]]"></oj-module>

</div>
