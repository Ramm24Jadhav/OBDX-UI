<div id="home-root" data-bind="css: {'rtl': currentLang() === 'ar'}">

  <div class="home-hero-sheet" data-bind="css: {'home-hero-sheet--collapsed': heroCollapsed()}">
    <home-appbar params="[[$data]]"></home-appbar>
    <!-- ko ifnot: isLoading() -->
    <div class="home-hero-body">
      <home-balance-summary params="[[$data]]"></home-balance-summary>
    </div>
    <!-- /ko -->
  </div>

  <div class="home-content" data-bind="css: {'home-content--loading': isLoading()}">

    <!-- ko ifnot: isLoading() -->
    <div class="home-sheet">
      <home-spending-overview params="[[$data]]"></home-spending-overview>
      <home-quick-actions     params="[[$data]]"></home-quick-actions>
      <home-recent-tx         params="[[$data]]"></home-recent-tx>
    </div>
    <!-- /ko -->

    <div class="bottom-spacer"></div>
  </div>

  <home-notifications-panel params="[[$data]]"></home-notifications-panel>
  <home-analytics-panel     params="[[$data]]"></home-analytics-panel>

</div>
