<!-- recent-transactions widget -->
<div class="section-wrap">
  <div class="section-header">
    <span class="section-title" data-bind="text: nls.home_recent_tx"></span>
    <span class="section-link" data-bind="click: goToAccounts, text: nls.home_see_all"></span>
  </div>
  <div class="tx-list" data-bind="foreach: transactions">
    <div class="tx-item">
      <div class="tx-icon" data-bind="style: {background: $parent.txIconBg(category)}, html: $parent.txIconSvg(category)"></div>
      <div class="tx-info">
        <div class="tx-name" data-bind="text: description"></div>
        <div class="tx-sub" data-bind="text: $data.merchant || ''"></div>
      </div>
      <div class="tx-right">
        <div class="tx-amount" data-bind="text: (type === 'CREDIT' ? '+' : '−') + 'LYD ' + $parent.formatAmount(amount), css: type === 'CREDIT' ? 'credit' : 'debit'"></div>
        <div class="tx-date" data-bind="text: date"></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;padding:16px;color:var(--c-t3);font-size:13px;" data-bind="visible: transactions().length === 0, text: nls.home_no_tx"></div>
</div>
