<!-- quick-actions widget -->
<div class="section">
  <div class="section-header">
    <span class="section-title" data-bind="text: nls.home_quick_actions"></span>
    <span class="section-link" data-bind="click: goToPay, text: nls.home_view_all"></span>
  </div>
  <div class="qa-grid">
    <div class="qa-item" data-bind="click: goToPay">
      <div class="qa-icon-wrap" style="background:#FCE7EE;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_transfer"></span>
    </div>
    <div class="qa-item" data-bind="click: goToPay">
      <div class="qa-icon-wrap" style="background:#DBEAFE;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_pay_bill"></span>
    </div>
    <div class="qa-item">
      <div class="qa-icon-wrap" style="background:#DCFCE7;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/><path d="M10 7h4"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_recharge"></span>
    </div>
    <div class="qa-item">
      <div class="qa-icon-wrap" style="background:#EDE9FE;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3" rx=".5"/><rect x="18" y="18" width="3" height="3" rx=".5"/><rect x="14" y="18" width="3" height="3" rx=".5"/><rect x="18" y="14" width="3" height="3" rx=".5"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_qr"></span>
    </div>
    <div class="qa-item" data-bind="click: goToAccounts">
      <div class="qa-icon-wrap" style="background:#FEF3C7;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_history"></span>
    </div>
    <div class="qa-item">
      <div class="qa-icon-wrap" style="background:#FCE7EE;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_invest"></span>
    </div>
    <div class="qa-item">
      <div class="qa-icon-wrap" style="background:#DBEAFE;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_loans"></span>
    </div>
    <div class="qa-item" data-bind="click: goToMore">
      <div class="qa-icon-wrap" style="background:var(--c-bg);border:1px solid var(--c-border);">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-t2)" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.5" fill="var(--c-t2)"/><circle cx="12" cy="12" r="1.5" fill="var(--c-t2)"/><circle cx="19" cy="12" r="1.5" fill="var(--c-t2)"/></svg>
      </div>
      <span class="qa-label" data-bind="text: nls.home_qa_more"></span>
    </div>
  </div>
</div>
