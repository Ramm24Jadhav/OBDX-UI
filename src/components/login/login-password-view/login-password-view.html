<div style="width:100%;" data-bind="visible: authMode() === 'password'" style="display:none;">
  <div style="text-align:center;margin-bottom:18px;">
    <div class="lb-mode-label" data-bind="text: nls.login_signin_label"></div>
    <div style="font-size:12px;color:var(--c-t3);margin-top:4px;" data-bind="text: nls.login_credentials_sub"></div>
  </div>
  <div class="form-group">
    <label class="form-label" data-bind="text: nls.login_username"></label>
    <input class="form-input" type="text" data-bind="attr: {placeholder: nls.login_username_ph}, value: username, valueUpdate: 'input'">
  </div>
  <div class="form-group">
    <label class="form-label" data-bind="text: nls.login_password"></label>
    <div class="form-input-wrap">
      <input class="form-input" data-bind="attr: {type: showPassword() ? 'text' : 'password', placeholder: nls.login_password_ph}, value: password, valueUpdate: 'input'">
      <button class="form-eye" data-bind="click: function(){ showPassword(!showPassword()); }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="form-forgot"><a href="#" data-bind="text: nls.login_forgot_pwd"></a></div>
  <div class="lb-error" data-bind="text: errorMsg, visible: errorMsg().length > 0"></div>
  <button class="btn-primary" data-bind="click: doLogin, css: {'btn-loading': isLoading()}">
    <span data-bind="visible: !isLoading(), text: nls.login_btn_login"></span>
    <span data-bind="visible: isLoading(), text: nls.login_btn_loading"></span>
  </button>
  <div class="lb-alt-methods" style="margin-top:14px;">
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('bio'); }, text: nls.login_fingerprint"></button>
    <span>·</span>
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('faceid'); }, text: nls.login_face_id"></button>
    <span>·</span>
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('mpin'); }, text: nls.login_mpin"></button>
  </div>
</div>
