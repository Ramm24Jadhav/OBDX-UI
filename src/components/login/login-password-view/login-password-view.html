<div style="width:100%;" data-bind="visible: authMode() === 'password'" style="display:none;">
  <div style="text-align:center;margin-bottom:18px;">
    <div class="lb-mode-label">Sign In</div>
    <div style="font-size:12px;color:var(--c-t3);margin-top:4px;">Enter your credentials</div>
  </div>
  <div class="form-group">
    <label class="form-label">Username</label>
    <input class="form-input" type="text" placeholder="Enter your username"
           data-bind="value: username, valueUpdate: 'input'">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <div class="form-input-wrap">
      <input class="form-input" placeholder="Enter your password"
             data-bind="attr: {type: showPassword() ? 'text' : 'password'}, value: password, valueUpdate: 'input'">
      <button class="form-eye" data-bind="click: function(){ showPassword(!showPassword()); }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="form-forgot"><a href="#">Forgot Password?</a></div>
  <div class="lb-error" data-bind="text: errorMsg, visible: errorMsg().length > 0"></div>
  <button class="btn-primary" data-bind="click: doLogin, css: {'btn-loading': isLoading()}">
    <span data-bind="visible: !isLoading()">Sign In</span>
    <span data-bind="visible: isLoading()">Signing in…</span>
  </button>
  <div class="lb-alt-methods" style="margin-top:14px;">
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('bio'); }">Fingerprint</button>
    <span>·</span>
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('faceid'); }">Face ID</button>
    <span>·</span>
    <button class="lb-alt-btn" data-bind="click: function(){ setMode('mpin'); }">MPIN</button>
  </div>
</div>
