<div class="login-hero">
  <!-- Language toggle -->
  <div style="position:absolute;top:14px;right:16px;z-index:10;">
    <button data-bind="click: toggleLang" style="display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);cursor:pointer;font-size:12px;font-weight:700;color:#fff;letter-spacing:.3px;">

      <span style="padding:2px 6px;border-radius:10px;background:rgba(255,255,255,.85);color:#1a0a00;">EN</span>

      <path d="M16 22 Q22 19 24 14" stroke="#C8A45D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M16 16 Q21 13 23 8" stroke="#C8A45D" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="16" cy="7" rx="2.5" ry="4" fill="#C8A45D" opacity=".9"/>
    </svg>
    <span>OBDX Mobile</span>
  </div>
  <h2 data-bind="text: nls.login_title"></h2>
  <p data-bind="text: nls.login_subtitle"></p>
</div>
