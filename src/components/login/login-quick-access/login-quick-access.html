<div class="lb-bottom-area">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
    <div style="flex:1;height:1px;background:var(--c-border);"></div>
    <span style="font-size:10px;font-weight:700;color:var(--c-t4);letter-spacing:.6px;text-transform:uppercase;">Quick Access</span>
    <div style="flex:1;height:1px;background:var(--c-border);"></div>
  </div>
  <div class="login-action-row">
    <div class="login-act-btn" data-bind="click: function(){ openOrigination('account'); }">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Open Account</span>
    </div>
    <div class="login-act-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>ATM &amp; Branch</span>
    </div>
    <div class="login-act-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      <span>Support</span>
    </div>
  </div>
  <div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--c-border);background:var(--c-surface);cursor:pointer;" data-bind="click: openTrackApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span style="font-size:13px;font-weight:700;color:var(--c-t1);">Track My Application</span>
    <span style="font-size:10px;font-weight:700;background:#FEF3C7;color:#D97706;padding:2px 7px;border-radius:20px;">No login needed</span>
  </div>
  <div class="login-secure" style="padding:12px 0 0;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>256-bit Secure Banking</span>
  </div>
</div>
