<div class="acct-dd" data-bind="css: {'acct-dd--open': open()}">
  <button class="acct-dd-trigger" data-bind="click: toggle">
    <!-- ko with: selected() -->
    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
      <div class="acct-dd-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="1.8" stroke-linecap="round" width="15" height="15"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      </div>
      <div style="flex:1;min-width:0;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: type + ' ' + number + (nickname ? ' · ' + nickname : '')"></div>
        <div class="s-num" style="font-size:11px;color:var(--c-t3);" data-bind="text: $parent.fmt(balance)"></div>
      </div>
    </div>
    <!-- /ko -->
    <!-- ko ifnot: selected() -->
    <span style="color:var(--c-t3);font-size:13px;">Select account</span>
    <!-- /ko -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;margin-left:8px;transition:transform .2s;" data-bind="style:{transform: open() ? 'rotate(180deg)' : 'rotate(0deg)'}"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <!-- ko if: open() -->
  <div class="acct-dd-menu">
    <!-- ko foreach: accounts() -->
    <div class="acct-dd-item" data-bind="click: $parent.select.bind($parent, $data), css: {'acct-dd-item--sel': $parent.selected() === $data}">
      <div class="acct-dd-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="1.8" stroke-linecap="round" width="15" height="15"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: type + ' ' + number + (nickname ? ' · ' + nickname : '')"></div>
        <div class="s-num" style="font-size:11px;color:var(--c-t3);" data-bind="text: $parent.fmt(balance)"></div>
      </div>
      <!-- ko if: $parent.selected() === $data -->
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg>
      <!-- /ko -->
    </div>
    <!-- /ko -->
  </div>
  <!-- /ko -->
</div>
