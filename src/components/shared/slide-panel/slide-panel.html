<div class="dep-panel" data-bind="css: {'dep-panel--open': open()}">

  <div class="dep-panel-header">
    <button class="dep-back-btn" data-bind="click: onBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="dep-panel-title" data-bind="text: title"></span>
    <div style="width:36px;"></div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px;scrollbar-width:none;">
    <!-- ko template: { nodes: $componentTemplateNodes } --><!-- /ko -->
  </div>

  <div class="dep-panel-footer" data-bind="style: {display: primaryLabel() ? 'block' : 'none'}">
    <!-- ko if: secondaryLabel() -->
    <div style="display:flex;gap:8px;">
      <button class="dep-btn dep-btn--ghost" style="flex:1;padding:14px;border-radius:14px;font-size:14px;"
              data-bind="click: onSecondary, text: secondaryLabel"></button>
      <button class="dep-btn-primary" style="flex:2;"
              data-bind="click: onPrimary, text: primaryLabel"></button>
    </div>
    <!-- /ko -->
    <!-- ko ifnot: secondaryLabel() -->
    <button class="dep-btn-primary" data-bind="click: onPrimary, text: primaryLabel"></button>
    <!-- /ko -->
  </div>

</div>
