<!-- session-countdown CCA — inactivity warning flip-clock popup
     Clock DOM is built programmatically by the ViewModel (CountdownTracker pattern). -->
<div class="sc-overlay" id="sc-overlay">
  <div class="sc-modal">

    <div class="sc-warn-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9"  x2="12"    y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <div class="sc-modal-title">Session Expiring</div>
    <div class="sc-modal-sub">You've been inactive. Your session will end in</div>

    <!-- Flip clock tiles injected here by ViewModel -->
    <div class="sc-flip-clock" id="sc-clock"></div>

    <button class="sc-btn" id="sc-stay-btn">Stay Logged In</button>

  </div>
</div>
