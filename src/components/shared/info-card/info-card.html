<div class="dep-info-card">
  <!-- ko foreach: rows() -->
  <div class="dep-info-row"
       data-bind="css: {'dep-info-row--last': $index() === $parent.rows().length - 1,
                        'dep-info-row--2col': !!$data.multiline}">
    <label data-bind="text: $data.label"></label>
    <span  data-bind="text: $data.value"></span>
  </div>
  <!-- /ko -->
</div>
