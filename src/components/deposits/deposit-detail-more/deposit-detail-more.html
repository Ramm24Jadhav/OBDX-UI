<div class="dep-sheet-backdrop" data-bind="visible: open(), click: onClose" style="display:none;z-index:520;"></div>
<div class="dep-sheet" style="z-index:520;" data-bind="css: {'dep-sheet--open': open()}">
  <div class="dep-sheet-handle"></div>
  <!-- ko with: dep() --><div class="dep-sheet-title" data-bind="text: name"></div><!-- /ko -->
  <div class="dep-sheet-actions">
    <button class="dep-sheet-row" data-bind="click: onEStatement">
      <div class="dep-sheet-row-icon" style="background:#DBEAFE;"><svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Subscribe E-Statement</div><div style="font-size:12px;color:var(--c-t3);">Auto-send statement to email</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onNickname">
      <div class="dep-sheet-row-icon" style="background:#EDE9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Add Nickname</div><div style="font-size:12px;color:var(--c-t3);">Set a display name for this deposit</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onCertificate">
      <div class="dep-sheet-row-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Profit Certificate</div><div style="font-size:12px;color:var(--c-t3);">Download profit certificate PDF</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onCopyIban">
      <div class="dep-sheet-row-icon" style="background:#FEF3C7;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Copy IBAN</div><div style="font-size:12px;color:var(--c-t3);">LY84 0210 0000 0000 0012 3456</div></div>
    </button>
  </div>
</div>
