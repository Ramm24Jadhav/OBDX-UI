<div class="dep-sheet-backdrop" data-bind="visible: open(), click: onClose" style="display:none;"></div>
<div class="dep-sheet" data-bind="css: {'dep-sheet--open': open()}">
  <div class="dep-sheet-handle"></div>
  <!-- ko with: dep() --><div class="dep-sheet-title" data-bind="text: name"></div><!-- /ko -->
  <div class="dep-sheet-actions">
    <button class="dep-sheet-row" data-bind="click: onViewDetail">
      <div class="dep-sheet-row-icon" style="background:#EFF6FF;"><svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">View Details</div><div style="font-size:12px;color:var(--c-t3);">Full deposit information &amp; analytics</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onCertificate">
      <div class="dep-sheet-row-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Profit Certificate</div><div style="font-size:12px;color:var(--c-t3);">Download profit certificate</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onCopyIban">
      <div class="dep-sheet-row-icon" style="background:#FEF3C7;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Copy IBAN</div><div style="font-size:12px;color:var(--c-t3);">LY84 0210 0000 0000 0012 3456</div></div>
    </button>
  </div>
</div>
