<!-- account: 3 steps — Personal Details → Product → Review -->
<!-- ko if: context() === 'account' -->
<div class="orig-steps">
  <div data-bind="css: {'orig-step-dot':true, 'cur': step()===1, 'done': step()>1}">1</div>
  <div data-bind="css: {'orig-step-line':true, 'done': step()>1}"></div>
  <div data-bind="css: {'orig-step-dot':true, 'cur': step()===2, 'done': step()>2}">2</div>
  <div data-bind="css: {'orig-step-line':true, 'done': step()>2}"></div>
  <div data-bind="css: {'orig-step-dot':true, 'cur': step()===3}">3</div>
</div>
<!-- /ko -->
