<div>
  <div class="orig-section-title">Nominee Details</div>
  <div class="orig-section-sub">Add a nominee for this deposit</div>

  <div class="orig-form-group">
    <label class="orig-form-label">Add Nominee</label>
    <div class="orig-pill-list">
      <div data-bind="css: {'orig-pill':true,'orig-pill--sel': addNominee()==='Yes'}, click: function(){ addNominee('Yes'); }">Yes</div>
      <div data-bind="css: {'orig-pill':true,'orig-pill--sel': addNominee()==='No'}, click: function(){ addNominee('No'); }">No</div>
    </div>
  </div>

  <!-- ko if: addNominee() === 'Yes' -->

  <div class="orig-form-group">
    <label class="orig-form-label">Nomination Type</label>
    <div class="orig-option-list">
      <div data-bind="css: {'orig-option':true,'orig-option--sel': nominationType()==='Add New'}, click: function(){ nominationType('Add New'); }">
        <div class="orig-option-radio"><div class="orig-option-radio-dot"></div></div>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Add New</div>
          <div style="font-size:11px;color:var(--c-t3);margin-top:2px;">Enter details of the new nominee</div>
        </div>
      </div>
      <div data-bind="css: {'orig-option':true,'orig-option--sel': nominationType()==='Replicate Existing Nominee'}, click: function(){ nominationType('Replicate Existing Nominee'); }">
        <div class="orig-option-radio"><div class="orig-option-radio-dot"></div></div>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--c-t1);">Replicate Existing Nominee</div>
          <div style="font-size:11px;color:var(--c-t3);margin-top:2px;">Use a nominee from another account</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Replicate: custom dropdown -->
  <!-- ko if: nominationType() === 'Replicate Existing Nominee' -->
  <div class="orig-form-group">
    <label class="orig-form-label">Select Existing Nominee</label>
    <div class="orig-dropdown">
      <button class="orig-dropdown-trigger" data-bind="click: toggleNomineeDropdown">
        <!-- ko if: selectedExistingNominee() -->
        <div style="flex:1;text-align:left;">
          <div style="font-size:13px;font-weight:700;color:var(--c-t1);" data-bind="text: selectedExistingNominee().name"></div>
          <div style="font-size:11px;color:var(--c-t3);" data-bind="text: selectedExistingNominee().accountType + ' ' + selectedExistingNominee().accountNo"></div>
        </div>
        <!-- /ko -->
        <!-- ko ifnot: selectedExistingNominee() -->
        <span class="orig-dd-placeholder" style="flex:1;text-align:left;">Select a nominee</span>
        <!-- /ko -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;transition:transform .2s;" data-bind="style:{transform: nomineeDropdownOpen() ? 'rotate(180deg)' : 'rotate(0deg)'}"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <!-- ko if: nomineeDropdownOpen() -->
      <div class="orig-dropdown-menu">
        <!-- ko foreach: existingNominees -->
        <div class="orig-dropdown-item" data-bind="click: $parent.selectExistingNomineeDD.bind($parent, $data), css: {'orig-dropdown-item--sel': $parent.selectedExistingNominee()===$data}">
          <div class="orig-dd-avatar" data-bind="text: $data.name.charAt(0)"></div>
          <div class="orig-dd-body">
            <div class="orig-dd-label" data-bind="text: $data.name"></div>
            <div class="orig-dd-sub" data-bind="text: $data.accountType + ' · ' + $data.accountNo"></div>
          </div>
          <!-- ko if: $parent.selectedExistingNominee()===$data -->
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg>
          <!-- /ko -->
        </div>
        <!-- /ko -->
      </div>
      <!-- /ko -->
    </div>
  </div>
  <!-- /ko -->

  <!-- Nominee fields -->
  <div class="orig-form-group">
    <label class="orig-form-label">Nominee Name</label>
    <input type="text" class="orig-form-input" placeholder="Full name" data-bind="value: nomineeName">
  </div>
  <div class="orig-form-group">
    <label class="orig-form-label">Date of Birth</label>
    <input type="date" class="orig-form-input" data-bind="value: nomineeDOB">
  </div>
  <div class="orig-form-group">
    <label class="orig-form-label">Relationship</label>
    <input type="text" class="orig-form-input" placeholder="e.g. Spouse, Son, Daughter" data-bind="value: nomineeRelationship">
  </div>
  <div class="orig-form-group">
    <label class="orig-form-label">Address</label>
    <input type="text" class="orig-form-input" placeholder="Street address" data-bind="value: nomineeAddress">
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="orig-form-group"><label class="orig-form-label">Country</label><input type="text" class="orig-form-input" placeholder="Country" data-bind="value: nomineeCountry"></div>
    <div class="orig-form-group"><label class="orig-form-label">State</label><input type="text" class="orig-form-input" placeholder="State" data-bind="value: nomineeState"></div>
    <div class="orig-form-group"><label class="orig-form-label">City</label><input type="text" class="orig-form-input" placeholder="City" data-bind="value: nomineeCity"></div>
    <div class="orig-form-group"><label class="orig-form-label">Zip Code</label><input type="text" class="orig-form-input" placeholder="Zip" data-bind="value: nomineeZip"></div>
  </div>

  <!-- Guardian (minor) -->
  <!-- ko if: isMinor() -->
  <div style="margin-top:8px;padding:12px 14px;border-radius:12px;background:#FEF3C7;border:1px solid #FDE68A;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round" width="16" height="16" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div style="font-size:12px;font-weight:700;color:#92400E;">Nominee is a minor — Guardian details required</div>
  </div>
  <div class="orig-form-group"><label class="orig-form-label">Guardian Name</label><input type="text" class="orig-form-input" placeholder="Full name of guardian" data-bind="value: guardianName"></div>
  <div class="orig-form-group"><label class="orig-form-label">Guardian Address</label><input type="text" class="orig-form-input" placeholder="Street address" data-bind="value: guardianAddress"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="orig-form-group"><label class="orig-form-label">Country</label><input type="text" class="orig-form-input" placeholder="Country" data-bind="value: guardianCountry"></div>
    <div class="orig-form-group"><label class="orig-form-label">State</label><input type="text" class="orig-form-input" placeholder="State" data-bind="value: guardianState"></div>
    <div class="orig-form-group"><label class="orig-form-label">City</label><input type="text" class="orig-form-input" placeholder="City" data-bind="value: guardianCity"></div>
    <div class="orig-form-group"><label class="orig-form-label">Zip Code</label><input type="text" class="orig-form-input" placeholder="Zip" data-bind="value: guardianZip"></div>
  </div>
  <!-- /ko -->

  <!-- /ko --><!-- end addNominee === Yes -->
</div>
