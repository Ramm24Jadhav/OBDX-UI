<div class="dep-panel" data-bind="css: {'dep-panel--open': open()}">
  <div class="dep-panel-header">
    <button class="dep-back-btn" data-bind="click: onClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="dep-panel-title">Loan Statement</div>
    <div style="width:36px;"></div>
  </div>
  <!-- ko if: !submitted() -->
  <!-- ko with: loan() -->
  <div style="flex:1;overflow-y:auto;padding:16px;">
    <div class="dep-summary-card">
      <div class="dep-summary-row"><span>Finance</span><strong data-bind="text: name"></strong></div>
      <div class="dep-summary-row" style="border:none;"><span>Reference</span><strong data-bind="text: ref"></strong></div>
    </div>
    <div class="dep-form-group">
      <label class="dep-form-label">Statement Period</label>
      <button class="app-picker-btn" data-bind="click: function(){ $parent.openPicker('Statement Period', ['Last 3 months','Last 6 months','Current year','Previous year','Full tenure'], $parent.statementPeriod); }">
        <span data-bind="text: $parent.statementPeriod()"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="dep-form-group">
      <label class="dep-form-label">Format</label>
      <button class="app-picker-btn" data-bind="click: function(){ $parent.openPicker('Format', ['PDF','Excel'], $parent.statementFormat); }">
        <span data-bind="text: $parent.statementFormat()"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <!-- /ko -->
  <div class="dep-panel-footer"><button class="dep-btn-primary" data-bind="click: onConfirm">Send to Email</button></div>
  <!-- /ko -->
  <!-- ko if: submitted() -->
  <div class="dep-success">
    <div class="dep-success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" width="36" height="36"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="dep-success-title">Statement Requested</div>
    <div class="dep-success-sub" data-bind="text: submittedMsg"></div>
    <button class="dep-btn-primary" style="width:100%;margin-top:24px;" data-bind="click: onClose">Done</button>
  </div>
  <!-- /ko -->
</div>
