<div class="dep-sheet-backdrop" style="z-index:515;" data-bind="visible: open(), click: onClose" style="display:none;"></div>
<div class="dep-sheet" style="z-index:520;" data-bind="css: {'dep-sheet--open': open()}">
  <div class="dep-sheet-handle"></div>
  <!-- ko with: loan() --><div class="dep-sheet-title" data-bind="text: name"></div><!-- /ko -->
  <div class="dep-sheet-actions">
    <button class="dep-sheet-row" data-bind="click: onDisbInquiry">
      <div class="dep-sheet-row-icon" style="background:#DBEAFE;"><svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Disbursement Inquiry</div><div style="font-size:12px;color:var(--c-t3);">View disbursement history</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onSchedule">
      <div class="dep-sheet-row-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Schedule Inquiry</div><div style="font-size:12px;color:var(--c-t3);">Full repayment schedule</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onEStatSub">
      <div class="dep-sheet-row-icon" style="background:#FEF3C7;"><svg viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Subscribe E-Statement</div><div style="font-size:12px;color:var(--c-t3);">Auto-send statement to email</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onInstCalc">
      <div class="dep-sheet-row-icon" style="background:#EDE9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Installment Calculator</div><div style="font-size:12px;color:var(--c-t3);">Calculate EMI for any loan</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onEligCalc">
      <div class="dep-sheet-row-icon" style="background:#DCFCE7;"><svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Eligibility Calculator</div><div style="font-size:12px;color:var(--c-t3);">Check maximum loan eligibility</div></div>
    </button>
    <button class="dep-sheet-row" data-bind="click: onNickname">
      <div class="dep-sheet-row-icon" style="background:#F0F9FF;"><svg viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div><div style="font-size:14px;font-weight:700;color:var(--c-t1);">Add Nickname</div><div style="font-size:12px;color:var(--c-t3);">Set a display name for this loan</div></div>
    </button>
  </div>
</div>
