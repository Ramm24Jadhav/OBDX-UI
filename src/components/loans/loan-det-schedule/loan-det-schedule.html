<div class="dep-panel" style="z-index:515;" data-bind="css: {'dep-panel--open': open()}">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--status-h,44px) 16px 14px;border-bottom:1px solid var(--c-border);flex-shrink:0;">
    <button class="dep-back-btn" data-bind="click: onClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="text-align:center;flex:1;">
      <div style="font-size:17px;font-weight:800;color:var(--c-t1);">Repayment Schedule</div>
      <div style="font-size:11px;color:var(--c-t3);margin-top:2px;">View your monthly EMI breakdown</div>
    </div>
    <button class="dep-back-btn" style="background:var(--c-surface);border:1px solid var(--c-border);"
            data-bind="click: function(){ window.obdxApp && window.obdxApp.showToast('Schedule downloading…', 'success'); }">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </button>
  </div>

  <!-- ko with: loan() -->
  <div style="flex:1;overflow-y:auto;padding:16px;">

    <!-- Two-tone summary card -->
    <div style="border:1px solid var(--c-border);border-radius:16px;overflow:hidden;margin-bottom:16px;">
      <div style="display:flex;align-items:stretch;">
        <div style="flex:1;padding:14px 16px;display:flex;align-items:center;gap:10px;border-right:1px solid var(--c-border);">
          <div style="width:34px;height:34px;border-radius:10px;background:rgba(var(--c-primary-rgb,139,0,0),.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="1.8" stroke-linecap="round" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span style="font-size:13px;font-weight:600;color:var(--c-t3);">Finance</span>
        </div>
        <div style="flex:1;padding:14px 16px;background:rgba(var(--c-primary-rgb,139,0,0),.04);display:flex;align-items:center;justify-content:flex-end;">
          <span style="font-size:14px;font-weight:800;color:var(--c-primary);text-align:right;" data-bind="text: name"></span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--c-border);">
        <span style="font-size:13px;font-weight:600;color:var(--c-t3);">Monthly EMI</span>
        <span class="s-num" style="font-size:16px;font-weight:800;color:var(--c-primary);" data-bind="text: $parent.fmt(emi)"></span>
      </div>
    </div>

    <!-- Column header bar -->
    <div style="display:grid;grid-template-columns:80px 1fr 1fr 1fr;background:var(--c-primary);border-radius:12px;padding:11px 14px;margin-bottom:8px;gap:4px;">
      <div style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8" stroke-linecap="round" width="13" height="13"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span style="font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;">Month</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8" stroke-linecap="round" width="13" height="13"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span style="font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;">Principal</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8" stroke-linecap="round" width="13" height="13"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span style="font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;">Profit</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8" stroke-linecap="round" width="13" height="13"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span style="font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;">Balance</span>
      </div>
    </div>

    <!-- ko foreach: schedule -->
    <div class="sched-row-card">
      <div class="sched-row-month">
        <div class="sched-month-name" data-bind="text: month.split(' ')[0]"></div>
        <div class="sched-month-year" data-bind="text: month.split(' ')[1]"></div>
      </div>
      <div class="sched-row-cell">
        <div class="sched-cell-cur">LYD</div>
        <div class="sched-cell-val" data-bind="text: $parents[1].fmtNum(principal)"></div>
      </div>
      <div class="sched-row-cell">
        <div class="sched-cell-cur">LYD</div>
        <div class="sched-cell-val" data-bind="text: $parents[1].fmtNum(interest)"></div>
      </div>
      <div class="sched-row-cell">
        <div class="sched-cell-cur">LYD</div>
        <div class="sched-cell-val" style="color:var(--c-t2);" data-bind="text: $parents[1].fmtNum(balance)"></div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-border)" stroke-width="2" width="14" height="14" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <!-- /ko -->

    <div class="bottom-spacer"></div>
  </div>
  <!-- /ko -->
</div>
