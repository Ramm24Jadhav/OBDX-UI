<!-- Dashboard container — keep-alive wrapper for all tab screens.
     All 6 slots are permanently in the DOM; only visibility toggles on tab switch.
     Uses KO template {nodes, data} binding to avoid nested oj-module upgrade issues. -->
<div class="dash-container">

  <!-- Login screen -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'login' }">
    <!-- ko if: tabVms.login() -->
    <!-- ko template: { nodes: tabViews.login(), data: tabVms.login() } --><!-- /ko -->
    <!-- /ko -->
  </div>

  <!-- Home tab -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'home' }">
    <!-- ko if: tabVms.home() -->
    <!-- ko template: { nodes: tabViews.home(), data: tabVms.home() } --><!-- /ko -->
    <!-- /ko -->
  </div>

  <!-- Accounts tab -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'accounts' }">
    <!-- ko if: tabVms.accounts() -->
    <!-- ko template: { nodes: tabViews.accounts(), data: tabVms.accounts() } --><!-- /ko -->
    <!-- /ko -->
    <!-- ko ifnot: tabVms.accounts() -->
    <div class="dash-tab-skeleton">
      <div class="dash-skel-hero"></div>
      <div class="dash-skel-body">
        <div class="dash-skel-row"></div>
        <div class="dash-skel-row dash-skel-row--short"></div>
        <div class="dash-skel-card"></div>
        <div class="dash-skel-row"></div>
      </div>
    </div>
    <!-- /ko -->
  </div>

  <!-- Pay tab -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'pay' }">
    <!-- ko if: tabVms.pay() -->
    <!-- ko template: { nodes: tabViews.pay(), data: tabVms.pay() } --><!-- /ko -->
    <!-- /ko -->
    <!-- ko ifnot: tabVms.pay() -->
    <div class="dash-tab-skeleton">
      <div class="dash-skel-hero"></div>
      <div class="dash-skel-body">
        <div class="dash-skel-row"></div>
        <div class="dash-skel-row dash-skel-row--short"></div>
        <div class="dash-skel-card"></div>
        <div class="dash-skel-row"></div>
      </div>
    </div>
    <!-- /ko -->
  </div>

  <!-- Cards tab -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'cards' }">
    <!-- ko if: tabVms.cards() -->
    <!-- ko template: { nodes: tabViews.cards(), data: tabVms.cards() } --><!-- /ko -->
    <!-- /ko -->
    <!-- ko ifnot: tabVms.cards() -->
    <div class="dash-tab-skeleton">
      <div class="dash-skel-hero"></div>
      <div class="dash-skel-body">
        <div class="dash-skel-row"></div>
        <div class="dash-skel-row dash-skel-row--short"></div>
        <div class="dash-skel-card"></div>
        <div class="dash-skel-row"></div>
      </div>
    </div>
    <!-- /ko -->
  </div>

  <!-- More tab -->
  <div class="dash-slot" data-bind="css: { 'dash-slot--active': currentTab() === 'more' }">
    <!-- ko if: tabVms.more() -->
    <!-- ko template: { nodes: tabViews.more(), data: tabVms.more() } --><!-- /ko -->
    <!-- /ko -->
    <!-- ko ifnot: tabVms.more() -->
    <div class="dash-tab-skeleton">
      <div class="dash-skel-hero"></div>
      <div class="dash-skel-body">
        <div class="dash-skel-row"></div>
        <div class="dash-skel-row dash-skel-row--short"></div>
        <div class="dash-skel-card"></div>
        <div class="dash-skel-row"></div>
      </div>
    </div>
    <!-- /ko -->
  </div>

</div>
