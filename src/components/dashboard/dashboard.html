<!-- Dashboard container — keep-alive wrapper for all tab screens.
     All 6 slots are permanently in the DOM; visibility is toggled
     via CSS display only, so ViewModels are never destroyed on tab switch. -->
<div class="dash-container">

  <!-- Login screen -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'login'">
    <oj-module config="[[tabs.login]]" style="display:block;height:100%;"></oj-module>
  </div>

  <!-- Home tab -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'home'">
    <oj-module config="[[tabs.home]]" style="display:block;height:100%;"></oj-module>
  </div>

  <!-- Accounts tab -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'accounts'">
    <oj-module config="[[tabs.accounts]]" style="display:block;height:100%;"></oj-module>
  </div>

  <!-- Pay tab -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'pay'">
    <oj-module config="[[tabs.pay]]" style="display:block;height:100%;"></oj-module>
  </div>

  <!-- Cards tab -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'cards'">
    <oj-module config="[[tabs.cards]]" style="display:block;height:100%;"></oj-module>
  </div>

  <!-- More tab -->
  <div class="dash-slot" data-bind="visible: currentTab() === 'more'">
    <oj-module config="[[tabs.more]]" style="display:block;height:100%;"></oj-module>
  </div>

</div>
